mod.version=3.5.3-3.4
mod.id=controlify
mod.name=Controlify Enhanced
mod.description=The most advanced controller mod for Minecraft.
mod.sourcesUrl=https://github.com/dx-Arcus/Controlify-Enhanced
mod.issuesUrl=https://github.com/dx-Arcus/Controlify-Enhanced/issues

# This fork has no Modrinth or CurseForge listing of its own. Releases go to GitHub
# only, by hand with gh, so these are placeholders rather than upstream's project
# IDs - a publishMods run must never be able to aim at the upstream pages. If this
# fork ever gets its own listings, put the real IDs here.
curseforge.id=0
curseforge.slug=unset
modrinth.id=unset
github.repo=dx-Arcus/Controlify-Enhanced

# The discord.* properties were removed on 2026-09-25, along with the announcement
# block in stonecutter.gradle.kts and the announceDiscord task from the publish
# workflow. This fork does not announce to Discord at all. Do not restore them.

# Temporary measure until https://github.com/FabricMC/fabric-loom/pull/1568
mtk.multiloader.createDefaultRuns=false

# This build is configuration cache compatible!*
# *other than a few upstream bugs...
org.gradle.configuration-cache=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.caching=true

# Increase the heap size for decompilations
org.gradle.jvmargs=-Xmx4G --enable-native-access=ALL-UNNAMED

# Required properties until https://github.com/neoforged/NeoGradle/pull/316
neogradle.subsystems.conventions.sourcesets.automatic-inclusion=false
neogradle.subsystems.conventions.runs.create-default-run-per-type=false
neogradle.subsystems.conventions.configurations.enabled=false
neogradle.subsystems.conventions.jarjar.create-main-jarjar=false
